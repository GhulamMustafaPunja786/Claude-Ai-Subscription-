<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="white"/>
  <text x="450" y="28" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 22  -  ELECTRICIAN PRO TOOLKIT (CURRENT vs PROPOSED)</text>
  <rect x="30" y="50" width="400" height="320" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c53030">CURRENT</text>
  <rect x="150" y="110" width="160" height="100" rx="4" fill="white" stroke="black"/>
  <text x="230" y="155" text-anchor="middle" font-family="Arial" font-size="10">Consumer app only</text>
  <text x="230" y="175" text-anchor="middle" font-family="Arial" font-size="9">Manual device setup</text>
  <text x="60" y="250" font-family="Arial" font-size="9">- No commissioning workflow</text>
  <text x="60" y="268" font-family="Arial" font-size="9">- No compliance test PDF</text>
  <text x="60" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#c53030">Impact: Slow trade adoption</text>
  <polygon points="450,210 470,200 470,220" fill="#276749"/>
  <rect x="490" y="50" width="380" height="320" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="680" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#276749">PROPOSED</text>
  <rect x="560" y="100" width="240" height="110" rx="4" fill="white" stroke="black"/>
  <text x="680" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">ElecSecure Pro</text>
  <text x="680" y="155" text-anchor="middle" font-family="Arial" font-size="9">QR scan - auto-configure</text>
  <text x="680" y="175" text-anchor="middle" font-family="Arial" font-size="9">Trip / AFCI test report PDF</text>
  <text x="680" y="195" text-anchor="middle" font-family="Arial" font-size="9">Contractor inventory module</text>
  <text x="520" y="250" font-family="Arial" font-size="9">+ CE Code update push notifications</text>
  <text x="520" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#276749">Impact: Electricians become advocates</text>
</svg>
