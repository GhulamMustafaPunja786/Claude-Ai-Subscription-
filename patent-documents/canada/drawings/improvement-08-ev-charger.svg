<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="white"/>
  <text x="450" y="28" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 19  -  EV CHARGER LOAD MANAGEMENT (CURRENT vs PROPOSED)</text>
  <rect x="30" y="50" width="400" height="320" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c53030">CURRENT</text>
  <rect x="140" y="110" width="180" height="80" rx="4" fill="white" stroke="black"/>
  <text x="230" y="145" text-anchor="middle" font-family="Arial" font-size="10">EV charger = unknown load</text>
  <text x="230" y="165" text-anchor="middle" font-family="Arial" font-size="9">Peak-hour charging risk</text>
  <text x="60" y="230" font-family="Arial" font-size="9">- No EV circuit detection</text>
  <text x="60" y="248" font-family="Arial" font-size="9">- Panel overload with HVAC + EV</text>
  <text x="60" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#c53030">Impact: $2K-5K panel upgrades</text>
  <polygon points="450,210 470,200 470,220" fill="#276749"/>
  <rect x="490" y="50" width="380" height="320" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="680" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#276749">PROPOSED</text>
  <rect x="540" y="100" width="280" height="100" rx="4" fill="white" stroke="black"/>
  <text x="680" y="130" text-anchor="middle" font-family="Arial" font-size="10">EV signature detected</text>
  <text x="680" y="150" text-anchor="middle" font-family="Arial" font-size="9">Auto-schedule off-peak charge</text>
  <text x="680" y="170" text-anchor="middle" font-family="Arial" font-size="9">FLO / ChargePoint / Tesla monitor</text>
  <text x="520" y="230" font-family="Arial" font-size="9">+ Panel capacity pre-check tool</text>
  <text x="520" y="248" font-family="Arial" font-size="9">+ Load shed before breaker trip</text>
  <text x="520" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#276749">Impact: EV-ready without panel upgrade</text>
</svg>
