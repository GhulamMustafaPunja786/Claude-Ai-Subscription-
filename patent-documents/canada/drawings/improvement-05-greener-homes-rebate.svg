<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="white"/>
  <text x="450" y="28" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 16  -  GREENER HOMES REBATE REPORTING (CURRENT vs PROPOSED)</text>
  <rect x="30" y="50" width="400" height="320" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c53030">CURRENT</text>
  <rect x="80" y="100" width="300" height="120" rx="4" fill="white" stroke="black"/>
  <text x="230" y="140" text-anchor="middle" font-family="Arial" font-size="11">In-app energy report</text>
  <text x="230" y="165" text-anchor="middle" font-family="Arial" font-size="9">PDF for homeowner only</text>
  <text x="230" y="185" text-anchor="middle" font-family="Arial" font-size="9">No rebate format</text>
  <text x="60" y="250" font-family="Arial" font-size="9">- Manual data entry for Greener Homes audit</text>
  <text x="60" y="268" font-family="Arial" font-size="9">- No before/after comparison export</text>
  <text x="60" y="286" font-family="Arial" font-size="9">- Auditors cannot verify install easily</text>
  <text x="60" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#c53030">Impact: Missed rebate-driven sales</text>
  <polygon points="450,210 470,200 470,220" fill="#276749"/>
  <text x="450" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#276749">ADD</text>
  <rect x="490" y="50" width="380" height="320" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="680" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#276749">PROPOSED</text>
  <rect x="530" y="100" width="300" height="120" rx="4" fill="white" stroke="black"/>
  <text x="680" y="135" text-anchor="middle" font-family="Arial" font-size="11">One-click NRCan export</text>
  <text x="680" y="158" text-anchor="middle" font-family="Arial" font-size="9">ON / BC / QC rebate templates</text>
  <text x="680" y="178" text-anchor="middle" font-family="Arial" font-size="9">Installer certificate PDF</text>
  <text x="520" y="250" font-family="Arial" font-size="9">+ Before/after kWh comparison</text>
  <text x="520" y="268" font-family="Arial" font-size="9">+ Audit-ready documentation bundle</text>
  <text x="520" y="286" font-family="Arial" font-size="9">+ Partner channel with energy auditors</text>
  <text x="520" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#276749">Impact: 10-30% cost offset via rebates</text>
</svg>
