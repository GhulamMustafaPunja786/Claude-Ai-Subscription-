<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720">
  <title>Figure 5 - Local Fault Detection Flowchart</title>
  <rect width="560" height="720" fill="white"/>
  <text x="280" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 5</text>

  <!-- Step boxes (center column) -->
  <rect x="170" y="50" width="220" height="40" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="75" text-anchor="middle" font-family="Arial" font-size="10">Acquire sensor data</text>
  <text x="410" y="75" font-family="Arial" font-size="11" font-weight="bold">502</text>

  <rect x="170" y="120" width="220" height="40" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="145" text-anchor="middle" font-family="Arial" font-size="10">Evaluate trip thresholds</text>
  <text x="410" y="145" font-family="Arial" font-size="11" font-weight="bold">504</text>

  <polygon points="280,190 330,220 280,250 230,220" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="225" text-anchor="middle" font-family="Arial" font-size="9">Short-circuit?</text>
  <text x="350" y="225" font-family="Arial" font-size="11" font-weight="bold">506</text>

  <rect x="30" y="270" width="150" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="105" y="292" text-anchor="middle" font-family="Arial" font-size="9">Magnetic trip</text>
  <text x="105" y="318" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">508</text>

  <polygon points="280,330 330,360 280,390 230,360" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="365" text-anchor="middle" font-family="Arial" font-size="9">Overload?</text>
  <text x="350" y="365" font-family="Arial" font-size="11" font-weight="bold">510</text>

  <rect x="30" y="410" width="150" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="105" y="432" text-anchor="middle" font-family="Arial" font-size="9">Thermal trip</text>
  <text x="105" y="458" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">512</text>

  <rect x="170" y="470" width="220" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="492" text-anchor="middle" font-family="Arial" font-size="9">Arc signature analysis</text>
  <text x="410" y="492" font-family="Arial" font-size="11" font-weight="bold">514</text>

  <polygon points="280,525 330,555 280,585 230,555" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="560" text-anchor="middle" font-family="Arial" font-size="9">Arc fault?</text>
  <text x="350" y="560" font-family="Arial" font-size="11" font-weight="bold">516</text>

  <rect x="360" y="540" width="150" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="435" y="562" text-anchor="middle" font-family="Arial" font-size="9">Arc extinguish</text>
  <text x="435" y="588" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">518</text>

  <rect x="170" y="620" width="220" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="642" text-anchor="middle" font-family="Arial" font-size="9">Transmit telemetry + alert</text>
  <text x="410" y="642" font-family="Arial" font-size="11" font-weight="bold">520</text>

  <!-- Arrows -->
  <line x1="280" y1="90" x2="280" y2="115" stroke="black" stroke-width="1"/>
  <polygon points="280,115 276,107 284,107" fill="black"/>
  <line x1="280" y1="160" x2="280" y2="185" stroke="black" stroke-width="1"/>
  <polygon points="280,185 276,177 284,177" fill="black"/>
  <line x1="230" y1="220" x2="105" y2="265" stroke="black" stroke-width="1"/>
  <polygon points="105,265 111,259 111,267" fill="black"/>
  <line x1="280" y1="250" x2="280" y2="325" stroke="black" stroke-width="1"/>
  <polygon points="280,325 276,317 284,317" fill="black"/>
  <line x1="230" y1="360" x2="105" y2="405" stroke="black" stroke-width="1"/>
  <polygon points="105,405 111,399 111,407" fill="black"/>
  <line x1="280" y1="390" x2="280" y2="465" stroke="black" stroke-width="1"/>
  <polygon points="280,465 276,457 284,457" fill="black"/>
  <line x1="280" y1="505" x2="280" y2="520" stroke="black" stroke-width="1"/>
  <polygon points="280,520 276,512 284,512" fill="black"/>
  <line x1="330" y1="555" x2="358" y2="555" stroke="black" stroke-width="1"/>
  <polygon points="358,555 350,551 350,559" fill="black"/>
  <line x1="280" y1="585" x2="280" y2="615" stroke="black" stroke-width="1"/>
  <polygon points="280,615 276,607 284,607" fill="black"/>

  <text x="280" y="700" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">500</text>
</svg>
