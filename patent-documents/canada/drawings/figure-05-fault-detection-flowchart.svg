<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <title>Figure 5 - Local Fault Detection Flowchart</title>
  <rect width="500" height="700" fill="white"/>
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 5</text>
  
  <rect x="150" y="50" width="200" height="40" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="10">Acquire sensor data</text>
  <text x="400" y="75" font-family="Arial" font-size="12" font-weight="bold">502</text>
  
  <rect x="150" y="120" width="200" height="40" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="145" text-anchor="middle" font-family="Arial" font-size="10">Evaluate trip thresholds</text>
  <text x="400" y="145" font-family="Arial" font-size="12" font-weight="bold">504</text>
  
  <polygon points="250,190 300,220 250,250 200,220" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="225" text-anchor="middle" font-family="Arial" font-size="9">Short-circuit?</text>
  <text x="330" y="225" font-family="Arial" font-size="12" font-weight="bold">506</text>
  
  <rect x="50" y="270" width="150" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="125" y="292" text-anchor="middle" font-family="Arial" font-size="9">Magnetic trip</text>
  <text x="220" y="292" font-family="Arial" font-size="12" font-weight="bold">508</text>
  
  <polygon points="250,330 300,360 250,390 200,360" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="365" text-anchor="middle" font-family="Arial" font-size="9">Overload?</text>
  <text x="330" y="365" font-family="Arial" font-size="12" font-weight="bold">510</text>
  
  <rect x="50" y="410" width="150" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="125" y="432" text-anchor="middle" font-family="Arial" font-size="9">Thermal trip</text>
  <text x="220" y="432" font-family="Arial" font-size="12" font-weight="bold">512</text>
  
  <rect x="150" y="470" width="200" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="492" text-anchor="middle" font-family="Arial" font-size="9">Arc signature analysis</text>
  <text x="400" y="492" font-family="Arial" font-size="12" font-weight="bold">514</text>
  
  <polygon points="250,525 300,555 250,585 200,555" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="560" text-anchor="middle" font-family="Arial" font-size="9">Arc fault?</text>
  <text x="330" y="560" font-family="Arial" font-size="12" font-weight="bold">516</text>
  
  <rect x="300" y="540" width="150" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="375" y="562" text-anchor="middle" font-family="Arial" font-size="9">Arc extinguish</text>
  <text x="470" y="562" font-family="Arial" font-size="12" font-weight="bold">518</text>
  
  <rect x="150" y="610" width="200" height="35" rx="5" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="250" y="632" text-anchor="middle" font-family="Arial" font-size="9">Transmit telemetry + alert</text>
  <text x="400" y="632" font-family="Arial" font-size="12" font-weight="bold">520-522</text>
  
  <!-- Arrows -->
  <line x1="250" y1="90" x2="250" y2="115" stroke="black" stroke-width="1"/>
  <polygon points="250,115 246,107 254,107" fill="black"/>
  <line x1="250" y1="160" x2="250" y2="185" stroke="black" stroke-width="1"/>
  <polygon points="250,185 246,177 254,177" fill="black"/>
  <line x1="200" y1="220" x2="125" y2="265" stroke="black" stroke-width="1"/>
  <polygon points="125,265 127,257 133,263" fill="black"/>
  <line x1="250" y1="250" x2="250" y2="325" stroke="black" stroke-width="1"/>
  <polygon points="250,325 246,317 254,317" fill="black"/>
  <line x1="200" y1="360" x2="125" y2="405" stroke="black" stroke-width="1"/>
  <polygon points="125,405 127,397 133,403" fill="black"/>
  <line x1="250" y1="390" x2="250" y2="465" stroke="black" stroke-width="1"/>
  <polygon points="250,465 246,457 254,457" fill="black"/>
  <line x1="250" y1="505" x2="250" y2="520" stroke="black" stroke-width="1"/>
  <polygon points="250,520 246,512 254,512" fill="black"/>
  <line x1="300" y1="555" x2="295" y2="555" stroke="black" stroke-width="1"/>
  <line x1="250" y1="585" x2="250" y2="605" stroke="black" stroke-width="1"/>
  <polygon points="250,605 246,597 254,597" fill="black"/>
  
  <text x="250" y="680" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">500</text>
</svg>
