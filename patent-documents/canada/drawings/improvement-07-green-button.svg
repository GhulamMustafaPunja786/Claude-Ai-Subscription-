<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="white"/>
  <text x="450" y="28" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 18  -  SMART METER DATA FUSION (CURRENT vs PROPOSED)</text>
  <rect x="30" y="50" width="400" height="320" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c53030">CURRENT</text>
  <rect x="150" y="110" width="80" height="60" rx="3" fill="white" stroke="black"/>
  <text x="190" y="145" text-anchor="middle" font-family="Arial" font-size="8">Circuits</text>
  <text x="190" y="200" text-anchor="middle" font-family="Arial" font-size="9">Device-level data only</text>
  <text x="60" y="250" font-family="Arial" font-size="9">- No utility meter connection</text>
  <text x="60" y="268" font-family="Arial" font-size="9">- Incomplete whole-home view</text>
  <text x="60" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#c53030">Impact: Gaps in energy picture</text>
  <polygon points="450,210 470,200 470,220" fill="#276749"/>
  <rect x="490" y="50" width="380" height="320" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="2"/>
  <text x="680" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#276749">PROPOSED</text>
  <rect x="520" y="110" width="70" height="50" rx="3" fill="white" stroke="black"/>
  <text x="555" y="140" text-anchor="middle" font-family="Arial" font-size="7">Circuits</text>
  <rect x="620" y="110" width="70" height="50" rx="3" fill="white" stroke="black"/>
  <text x="655" y="135" text-anchor="middle" font-family="Arial" font-size="7">Green</text>
  <text x="655" y="148" text-anchor="middle" font-family="Arial" font-size="7">Button</text>
  <rect x="720" y="110" width="100" height="50" rx="3" fill="#276749"/>
  <text x="770" y="140" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Fused view</text>
  <line x1="590" y1="135" x2="620" y2="135" stroke="#276749" stroke-width="2"/>
  <line x1="690" y1="135" x2="720" y2="135" stroke="#276749" stroke-width="2"/>
  <text x="520" y="200" font-family="Arial" font-size="9">+ Hydro-Qu-bec / BC Hydro APIs</text>
  <text x="520" y="218" font-family="Arial" font-size="9">+ Discrepancy alerts (wiring losses)</text>
  <text x="520" y="340" font-family="Arial" font-size="10" font-weight="bold" fill="#276749">Impact: Whole-home trust + fault detection</text>
</svg>
